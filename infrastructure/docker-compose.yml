services:
  postgres:
    image: postgres:17
    container_name: daypilot-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-daypilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-daypilot}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-daypilot} -d ${POSTGRES_DB:-daypilot}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
