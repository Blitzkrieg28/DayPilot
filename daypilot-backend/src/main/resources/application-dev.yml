spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:daypilot}
    username: ${POSTGRES_USER:daypilot}
    password: ${POSTGRES_PASSWORD:}

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.daypilot: DEBUG
    org.springframework.ai: DEBUG
    org.hibernate.SQL: DEBUG
