spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/daypilot
    username: daypilot
    password: daypilot_local_secret

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: false # tests don't migrate, maven plugin already migrated the real DB

logging:
  level:
    org.hibernate.SQL: DEBUG
